<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bill</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  :root{
    --bg:#f0eee8; --paper:#ffffff; --ink:#1c2130; --muted:#6b6660; --line:#d9d4ca; --line2:#ece7dd;
    --accent:#2f4bd6; --accent-2:#148a7c;
    --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#121419; --paper:#1b1e25; --ink:#e9e6e0; --muted:#9a958c; --line:#333842; --line2:#262a31;
    --accent:#7389ff; --accent-2:#3dc6b4; color-scheme:dark;
  }}
  :root[data-theme="dark"]{ --bg:#121419; --paper:#1b1e25; --ink:#e9e6e0; --muted:#9a958c; --line:#333842; --line2:#262a31; --accent:#7389ff; --accent-2:#3dc6b4; color-scheme:dark; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  .bar{max-width:820px;margin:0 auto;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  a.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
  a.back:hover{text-decoration:underline}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:8px;padding:9px 16px;cursor:pointer}
  .btn:hover{opacity:.9}
  .tnum{font-variant-numeric:tabular-nums}

  .sheet{max-width:820px;margin:16px auto 40px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:32px 34px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px}
  .co .nm{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .co .ad{font-size:12px;color:var(--muted);max-width:360px;margin-top:4px}
  .co .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .inv{text-align:right}
  .inv .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .inv .no{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1}
  .inv .dt{font-size:12.5px;color:var(--muted);margin-top:4px}

  .parties{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
  .pty .h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
  .pty .nm{font-size:15px;font-weight:600}
  .pty .ln{font-size:12.5px;color:var(--muted)}
  .pty .gst{font-family:var(--mono);font-size:11.5px;margin-top:4px}
  .pty .gst b{color:var(--ink);font-weight:600}

  .ship{margin-top:18px;border:1px solid var(--line2);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 26px;font-size:12.5px}
  .ship .k{color:var(--muted);margin-right:6px}
  .ship .v{font-family:var(--mono)}

  table.amt{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px}
  table.amt td{padding:8px 4px}
  table.amt tr.line td{border-bottom:1px solid var(--line2)}
  table.amt .lbl{color:var(--muted)}
  table.amt .val{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  table.amt tr.grand td{border-top:2px solid var(--ink);font-size:17px;font-weight:700;padding-top:12px}
  table.amt tr.grand .val{font-family:var(--mono)}

  .comm{margin-top:18px;background:color-mix(in srgb,var(--accent-2) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent-2) 35%,transparent);border-radius:8px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;font-size:13px;flex-wrap:wrap;gap:6px}
  .comm b{color:var(--accent-2)}
  .foot{margin-top:24px;border-top:1px solid var(--line2);padding-top:12px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  #load{max-width:820px;margin:40px auto;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
  #err{max-width:820px;margin:40px auto;color:#c6482f}
  .amount-words{margin-top:6px;font-size:12px;color:var(--muted);font-style:italic}

  @media (max-width:560px){ .parties{grid-template-columns:1fr} .sheet{padding:22px 18px} }
  @media print{
    .bar{display:none} body{background:#fff} .sheet{border:none;box-shadow:none;margin:0;max-width:none}
    :root{--paper:#fff;--ink:#000;--muted:#444;--line:#000;--line2:#bbb}
  }
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="sales.html">&larr; Back to weekly sales</a>
  <button class="btn" id="printBtn">Print / Save PDF</button>
</div>
<div id="load">Loading bill&hellip;</div>
<div id="err" hidden></div>
<div class="sheet" id="sheet" hidden></div>

  <script src="data.js"></script>
<script>
  function grp(n){ var neg=n<0; n=Math.abs(Math.round(n*100)/100); var p=n.toFixed(2).split("."); var i=p[0]; var l3=i.slice(-3),r=i.slice(0,-3); if(r)l3=","+l3; return (neg?"-":"")+r.replace(/\B(?=(\d{2})+(?!\d))/g,",")+l3+"."+p[1]; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function q(name){ var m=new RegExp("[?&]"+name+"=([^&]+)").exec(location.search); return m?decodeURIComponent(m[1]):""; }

  // number to words (Indian), for the invoice total
  function words(num){
    num=Math.round(num);
    if(num===0) return "Zero";
    var a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
    var b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
    function two(n){ return n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:""); }
    function three(n){ return (n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):""); }
    var out="",crore=Math.floor(num/10000000); num%=10000000;
    var lakh=Math.floor(num/100000); num%=100000;
    var thou=Math.floor(num/1000); num%=1000;
    if(crore) out+=three(crore)+" Crore ";
    if(lakh) out+=two(lakh)+" Lakh ";
    if(thou) out+=two(thou)+" Thousand ";
    if(num) out+=three(num);
    return out.trim();
  }

  function row(lbl,val,cls){ return '<tr class="line"><td class="lbl">'+lbl+'</td><td class="val '+(cls||"")+'">'+val+'</td></tr>'; }

  function render(d){
    document.getElementById("load").hidden=true;
    var s=document.getElementById("sheet"); s.hidden=false;
    document.title="Bill "+d.bill.no+" – "+d.buyer.name;
    var co=d.company, by=d.buyer, ml=d.mill, am=d.amounts, bl=d.bill;
    var buyerAddr=[by.add1,by.add2,by.add3].filter(Boolean).join(", ");
    var buyerLoc=[by.city,by.state,by.pin].filter(Boolean).join(" ");
    var ship=[];
    if(bl.transporter) ship.push('<span><span class="k">Transport</span><span class="v">'+esc(bl.transporter)+'</span></span>');
    if(bl.lrNo) ship.push('<span><span class="k">LR No</span><span class="v">'+esc(bl.lrNo)+(bl.lrDate?" ("+esc(bl.lrDate)+")":"")+'</span></span>');
    if(bl.salesman) ship.push('<span><span class="k">Agent</span><span class="v">'+esc(bl.salesman)+'</span></span>');
    if(bl.remarks) ship.push('<span><span class="k">Remarks</span><span class="v">'+esc(bl.remarks)+'</span></span>');

    var amtRows="";
    amtRows+=row("Goods value","₹ "+grp(am.goods));
    if(am.disc1) amtRows+=row("Discount","- ₹ "+grp(am.disc1));
    if(am.disc2) amtRows+=row("Discount 2","- ₹ "+grp(am.disc2));
    if(am.charges) amtRows+=row("Charges","₹ "+grp(am.charges));
    if(am.gst) amtRows+=row("GST @ "+am.gstPerc+"%","₹ "+grp(am.gst));
    if(am.tcs) amtRows+=row("TCS","₹ "+grp(am.tcs));

    s.innerHTML=
      '<div class="top">'+
        '<div class="co"><div class="tag">Commission Bill</div><div class="nm">'+esc(co.name)+'</div>'+
          '<div class="ad">'+esc(co.addr||"")+'</div>'+(co.gstin?'<div class="pty gst">GSTIN <b>'+esc(co.gstin)+'</b></div>':'')+'</div>'+
        '<div class="inv"><div class="t">Bill No.</div><div class="no">'+esc(bl.no)+'</div><div class="dt">'+esc(bl.date)+'</div></div>'+
      '</div>'+
      '<div class="parties">'+
        '<div class="pty"><div class="h">Billed to (Buyer)</div><div class="nm">'+esc(by.name)+'</div>'+
          (buyerAddr?'<div class="ln">'+esc(buyerAddr)+'</div>':'')+(buyerLoc?'<div class="ln">'+esc(buyerLoc)+'</div>':'')+
          (by.mobile?'<div class="ln">Ph: '+esc(by.mobile)+'</div>':'')+
          (by.gstin?'<div class="gst">GSTIN <b>'+esc(by.gstin)+'</b></div>':'')+'</div>'+
        '<div class="pty"><div class="h">Goods of (Manufacturer)</div><div class="nm">'+esc(ml.name)+'</div>'+
          '<div class="ln">'+[ml.city,ml.state].filter(Boolean).map(esc).join(", ")+'</div>'+
          (ml.gstin?'<div class="gst">GSTIN <b>'+esc(ml.gstin)+'</b></div>':'')+'</div>'+
      '</div>'+
      (ship.length?'<div class="ship">'+ship.join("")+'</div>':'')+
      '<table class="amt">'+amtRows+
        '<tr class="grand"><td class="lbl">Total</td><td class="val">₹ '+grp(am.total)+'</td></tr>'+
      '</table>'+
      '<div class="amount-words">Rupees '+words(am.total)+' only</div>'+
      '<div class="comm"><span>Commission you expect on this bill ('+d.commission.rate+'%)</span><b>₹ '+grp(d.commission.expected)+'</b></div>'+
      '<div class="foot"><span>Voucher '+bl.vno+' · reconstructed from the SARAL books</span><span>'+esc(co.ph1||"")+(co.ph2?" / "+esc(co.ph2):"")+'</span></div>';
  }

  var vno=q("vno");
  fetch("/api/bill?vno="+encodeURIComponent(vno),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok) throw new Error(d.error||"not found");
    render(d);
  }).catch(function(e){
    document.getElementById("load").hidden=true;
    var er=document.getElementById("err"); er.hidden=false;
    er.innerHTML="Couldn't load this bill. The <b>demo</b> window must be open. ("+esc(e.message)+")";
  });
  document.getElementById("printBtn").addEventListener("click",function(){ window.print(); });
</script>
</body>
</html>
