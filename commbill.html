<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Commission bill</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  :root{
    --bg:#f0eee8; --paper:#ffffff; --ink:#1c2130; --muted:#6b6660; --line:#d9d4ca; --line2:#ece7dd;
    --accent:#2f4bd6; --accent-2:#148a7c;
    --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#121419; --paper:#1b1e25; --ink:#e9e6e0; --muted:#9a958c; --line:#333842; --line2:#262a31;
    --accent:#7389ff; --accent-2:#3dc6b4; color-scheme:dark;
  }}
  :root[data-theme="dark"]{ --bg:#121419; --paper:#1b1e25; --ink:#e9e6e0; --muted:#9a958c; --line:#333842; --line2:#262a31; --accent:#7389ff; --accent-2:#3dc6b4; color-scheme:dark; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  .bar{max-width:820px;margin:0 auto;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  a.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px} a.back:hover{text-decoration:underline}
  .btn{font-family:var(--sans);font-size:13px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:8px;padding:9px 16px;cursor:pointer} .btn:hover{opacity:.9}
  .tnum{font-variant-numeric:tabular-nums}

  .sheet{max-width:820px;margin:16px auto 40px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:32px 34px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px}
  .co .nm{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .co .ad{font-size:12px;color:var(--muted);max-width:360px;margin-top:4px}
  .co .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:600}
  .inv{text-align:right}
  .inv .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .inv .no{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1}
  .inv .dt{font-size:12.5px;color:var(--muted);margin-top:4px}

  .parties{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
  .pty .h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
  .pty .nm{font-size:15px;font-weight:600}
  .pty .ln{font-size:12.5px;color:var(--muted)}
  .pty .gst{font-family:var(--mono);font-size:11.5px;margin-top:4px}
  .pty .gst b{color:var(--ink);font-weight:600}

  .intro{margin-top:18px;font-size:13px;color:var(--muted)}
  table.bills{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
  table.bills th,table.bills td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:left}
  table.bills th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  table.bills td.n,table.bills th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  table.bills tr.sub td{border-top:2px solid var(--ink);font-weight:600;border-bottom:none;padding-top:10px}

  .calc{margin-top:20px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .calc .r{display:flex;justify-content:space-between;padding:10px 15px;font-size:13.5px;border-bottom:1px solid var(--line2)}
  .calc .r:last-child{border-bottom:none}
  .calc .r.grand{background:color-mix(in srgb,var(--accent-2) 12%,transparent);font-weight:700;font-size:17px}
  .calc .r .v{font-family:var(--mono)}
  .calc .r.grand .v{color:var(--accent-2)}
  .settle{margin-top:16px;font-size:12.5px;color:var(--muted)}
  .settle b{color:var(--ink)}
  .foot{margin-top:24px;border-top:1px solid var(--line2);padding-top:12px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  #load{max-width:820px;margin:40px auto;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
  #err{max-width:820px;margin:40px auto;color:#c6482f}
  @media (max-width:560px){ .parties{grid-template-columns:1fr} .sheet{padding:22px 18px} }
  @media print{ .bar{display:none} body{background:#fff} .sheet{border:none;box-shadow:none;margin:0;max-width:none} :root{--paper:#fff;--ink:#000;--muted:#444;--line:#000;--line2:#bbb} }
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="commweekly.html">&larr; Back to weekly commission</a>
  <button class="btn" id="printBtn">Print / Save PDF</button>
</div>
<div id="load">Loading commission bill&hellip;</div>
<div id="err" hidden></div>
<div class="sheet" id="sheet" hidden></div>

  <script src="data.js"></script>
<script>
  function grp(n){ var neg=n<0; n=Math.abs(Math.round(n*100)/100); var p=n.toFixed(2).split("."); var i=p[0]; var l3=i.slice(-3),r=i.slice(0,-3); if(r)l3=","+l3; return (neg?"-":"")+r.replace(/\B(?=(\d{2})+(?!\d))/g,",")+l3+"."+p[1]; }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function q(name){ var m=new RegExp("[?&]"+name+"=([^&]+)").exec(location.search); return m?decodeURIComponent(m[1]):""; }

  function render(d){
    document.getElementById("load").hidden=true;
    var s=document.getElementById("sheet"); s.hidden=false;
    document.title="Commission bill "+d.vno+" – "+d.mill.name;
    var co=d.company, ml=d.mill, by=d.buyer;
    var rows="";
    d.items.forEach(function(it){ rows+='<tr><td class="tnum">'+esc(it.ref)+'</td><td class="tnum">'+esc(it.date)+'</td><td class="n">₹ '+grp(it.amount)+'</td></tr>'; });
    s.innerHTML=
      '<div class="top">'+
        '<div class="co"><div class="tag">Brokerage / Commission Bill</div><div class="nm">'+esc(co.name)+'</div>'+
          '<div class="ad">'+esc(co.addr||"")+'</div></div>'+
        '<div class="inv"><div class="t">Commission bill</div><div class="no">CM-'+d.vno+'</div><div class="dt">'+esc(d.date)+'</div></div>'+
      '</div>'+
      '<div class="parties">'+
        '<div class="pty"><div class="h">Billed to (Manufacturer)</div><div class="nm">'+esc(ml.name)+'</div>'+
          '<div class="ln">'+[ml.city,ml.state].filter(Boolean).map(esc).join(", ")+'</div>'+
          (ml.gstin?'<div class="gst">GSTIN <b>'+esc(ml.gstin)+'</b></div>':'')+'</div>'+
        '<div class="pty"><div class="h">Commission on goods sold to</div><div class="nm">'+esc(by.name)+'</div>'+
          '<div class="ln">'+[by.city,by.state].filter(Boolean).map(esc).join(", ")+'</div>'+
          (by.gstin?'<div class="gst">GSTIN <b>'+esc(by.gstin)+'</b></div>':'')+'</div>'+
      '</div>'+
      '<div class="intro">Commission due on the following '+d.billCount+' sale bill'+(d.billCount===1?'':'s')+' of your goods:</div>'+
      '<table class="bills"><thead><tr><th>Sale bill #</th><th>Date</th><th class="n">Bill amount</th></tr></thead><tbody>'+
        rows+
        '<tr class="sub"><td colspan="2">Total goods value</td><td class="n">₹ '+grp(d.base)+'</td></tr>'+
      '</tbody></table>'+
      '<div class="calc">'+
        '<div class="r"><span>Goods value (base)</span><span class="v">₹ '+grp(d.base)+'</span></div>'+
        '<div class="r"><span>Commission rate</span><span class="v">'+d.rate+'%</span></div>'+
        '<div class="r grand"><span>Commission due</span><span class="v">₹ '+grp(d.commission)+'</span></div>'+
      '</div>'+
      '<div class="settle">Settlement: <b>'+esc(d.mode||"—")+'</b>'+(d.cheque && d.cheque!==d.mode?' · ref '+esc(d.cheque):'')+'</div>'+
      '<div class="foot"><span>Voucher CM-'+d.vno+' · reconstructed from the SARAL books</span><span>'+esc(co.ph1||"")+(co.ph2?" / "+esc(co.ph2):"")+'</span></div>';
  }

  fetch("/api/commbill?vno="+encodeURIComponent(q("vno")),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(!d.ok) throw new Error(d.error||"not found");
    render(d);
  }).catch(function(e){
    document.getElementById("load").hidden=true;
    var er=document.getElementById("err"); er.hidden=false;
    er.innerHTML="Couldn't load this commission bill. The <b>demo</b> window must be open. ("+esc(e.message)+")";
  });
  document.getElementById("printBtn").addEventListener("click",function(){ window.print(); });
</script>
</body>
</html>
